# Sources publiques crawlées par l'agent d'extraction.
factsheet_url: "https://reforms-investments.ec.europa.eu/technical-support-instrument-0/our-projects/tsi-country-factsheets/{slug}_en"
spotlight_url: "https://reforms-investments.ec.europa.eu/technical-support-instrument-0/our-projects/projects-spotlight_en"
policy_area_url: "https://reforms-investments.ec.europa.eu/technical-support-instrument-0/{slug}_en"
policy_areas:
  - competitiveness
  - digital-transition
  - financial-sector-and-access-finance
  - green-transition
  - health-and-long-term-care
  - labour-market-and-social-protection
  - migration-management
  - public-administration-and-governance
  - revenue-administration-and-public-financial-management
  - skills-education-and-training
# Sitemap du site : pages projet absentes des listings ci-dessus (projets connus seulement en thin, ou nouveaux).
# Rubriques exclues : pages de navigation et appels "flagship" (pas des pages projet).
sitemap_url: "https://reforms-investments.ec.europa.eu/sitemap.xml"
sitemap_excluded_areas:
  - our-projects
  - our-projects-0
  - what-we-do
  - other-eu-support-opportunities
  - our-partners
  - flagship-technical-support-projects
srsp_pdf_url: "https://commission.europa.eu/system/files/2020-03/rss-technical-support-per-country_en.pdf"
programme_docs:
  - id: tsi-performance
    title: Technical Support Instrument - programme performance
    url: "https://commission.europa.eu/strategy-and-policy/eu-budget/performance-and-reporting/programme-performance-statements/technical-support-instrument-performance_en"
# Publications qui ne sont pas des livrables de projet : recommandations par pays (CSR) du Semestre europeen, liees
# par erreur depuis des pages projet. Motifs (sous-chaines, sans casse) cherches dans l'id, le titre et l'URL de la
# publication : ecartees par `deliverables`, retirees des projets ; texte integral garde dans output/csr/publications/.
deliverable_exclude_patterns:
  - country-specific-recommendations
  - country specific recommendation
