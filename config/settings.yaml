# Réglages d'exécution locale. Chemins relatifs à la racine du dépôt.
output_dir: output
logs_dir: logs
cache_dir: .cache/http
user_agent: "TSI-Extraction-Agent/0.1 (DG REFORM project; polite crawler)"
min_interval_s: 2.0   # le site renvoie des 429 au-delà d'environ 1 req/s soutenue
model: sonnet
llm_timeout_s: 180
max_concurrency: 2
chunk_size: 25

# Couche vectorisée (python -m tsi_agent index)
vectors_dir: output/vectors
embedding_model: intfloat/multilingual-e5-small   # local, multilingue ; OpenAI text-embedding-3-small dans deepset
embedding_batch_size: 32
