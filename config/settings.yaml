# Réglages d'exécution locale. Chemins relatifs à la racine du dépôt.
output_dir: output
logs_dir: logs
cache_dir: .cache/http
user_agent: "TSI-Extraction-Agent/0.1 (DG REFORM project; polite crawler)"
min_interval_s: 2.0   # le site renvoie des 429 au-delà d'environ 1 req/s soutenue
model: sonnet
llm_timeout_s: 180
max_concurrency: 2
chunk_size: 25

# Fournisseur LLM des etapes de mise a jour (run, deliverables, arbitrage du sitemap, csr-link)
llm_provider: claude_cli     # claude_cli (CLI Claude, souscription) ou openai (API compatible OpenAI)
openai_base_url:             # mode openai : ex. https://api.tech.ec.europa.eu/ecgpt/v1 (EC GPT) ; vide = API OpenAI
openai_api_key_env: OPENAI_API_KEY   # variable d'environnement (ou ligne de .env) qui contient la cle
openai_model: gpt-5.1
openai_timeout_s: 300        # delai minimal d'un appel en mode openai
openai_max_retries: 2        # nouvelles tentatives du client OpenAI (erreurs reseau, 429, 5xx)
openai_max_completion_tokens:   # plafond de tokens de sortie (raisonnement compris) ; vide = aucun
# Couts en mode openai ($ par million de tokens, par prefixe du modele `openai/<openai_model>`), par exemple :
# pricing:
#   openai/gpt-5.1: {input: 1.25, output: 10.0}

# Couche vectorisée (python -m tsi_agent index)
vectors_dir: ~/tsi-vectors   # hors OneDrive : base Qdrant locale
embedding_dim: 384
embedding_model: intfloat/multilingual-e5-small   # local, multilingue ; OpenAI text-embedding-3-small dans deepset
embedding_batch_size: 32

# Chatbot (python -m tsi_agent chat)
chat_model: sonnet
chat_max_steps: 6     # appels LLM maximum par question
chat_port: 8765
finder_project_pool: 60          # find_projects : projets gardes depuis les textes projet
finder_project_chunks: 400       # morceaux projet lus avant regroupement par projet
finder_deliverable_pool: 30      # projets gardes depuis les livrables
finder_deliverable_chunks: 300   # morceaux livrable lus avant regroupement par projet
finder_max_candidates: 150       # lignes de candidats listees au plus

# Livrables des projets (python -m tsi_agent deliverables)
deliverables_dir: output/deliverables
deliverables_max_words: 15000   # debut des documents envoye au LLM pour le resume
deliverables_max_pdf_mb: 50
deliverables_llm_timeout_s: 600   # prompts longs, jusqu'a 15 000 mots
deliverables_recheck_days: 7   # publications traitees depuis moins de N jours : page non reverifiee (sauf --full)
deliverables_fetch_chunk: 25   # pages de publication lues par lot ; chaque lot est enregistre avant le suivant

# Analyse d'impact (onglet "Impact analysis" de la page web)
impact_dir: output/impact
impact_model: opus          # Opus : modele le plus capable pour l'analyse
impact_score_model: opus    # score de 0 a 10 calcule a partir du rapport
impact_max_steps: 20        # appels LLM maximum par analyse
impact_max_searches: 10     # recherches web maximum par analyse
impact_page_words: 3000     # texte d'une page web transmis a l'agent
impact_page_max_mb: 20      # taille maximale d'une page ou d'un document telecharge (Mo)
impact_project_chars: 20000
impact_llm_timeout_s: 600
web_search_model: haiku     # la recherche web elle-meme (CLI claude, outil WebSearch)
web_search_timeout_s: 180
