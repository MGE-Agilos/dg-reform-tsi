<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSI Projects Chat</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --muted:#667085; --accent:#1f4e9e; --border:#dde2ea; --ai:#8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --accent:#7aa7ff; --border:#2c3441; --ai:#e0b458; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--card); }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 140px; }
  .msg { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin:12px 0; }
  .msg.user { border-left:4px solid var(--accent); }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .msg .body p { margin:.4em 0; }
  .msg .body ul, .msg .body ol { margin:.4em 0; padding-left:1.3em; }
  .msg .body h3 { font-size:16px; margin:.7em 0 .3em; }
  .msg .body h4 { font-size:14px; margin:.7em 0 .3em; }
  .msg .body hr { border:none; border-top:1px solid var(--border); margin:.8em 0; }
  .msg .body blockquote { margin:.4em 0; padding:.2em .9em; border-left:3px solid var(--border); color:var(--muted); }
  .msg .body code { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 4px; font-size:.9em; }
  .msg .body .table-wrap { overflow-x:auto; margin:.5em 0; }
  .msg .body table { border-collapse:collapse; width:100%; font-size:14px; }
  .msg .body th, .msg .body td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
  .msg .body th { background:var(--bg); font-weight:600; }
  .msg sup a { text-decoration:none; }
  .sources, details { margin-top:10px; font-size:13px; color:var(--muted); }
  .sources ol { margin:4px 0; padding-left:1.4em; }
  .sources a, .msg a { color:var(--accent); }
  .ai { color:var(--ai); font-size:12px; }
  details code { font-size:12px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .error { border-color:#d92d20; color:#d92d20; }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); padding:12px 16px; }
  form .row { max-width:900px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:vertical; min-height:48px; max-height:200px; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .loading { display:flex; align-items:center; gap:10px; color:var(--muted); }
  .loading .elapsed { font-size:12px; font-variant-numeric:tabular-nums; }
  .dots { display:inline-flex; gap:5px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay:.15s; }
  .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,80%,100% { transform:scale(.5); opacity:.4; } 40% { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation:none; opacity:.7; } }
  .hint { max-width:900px; margin:6px auto 0; font-size:12px; color:var(--muted); }
  [hidden] { display:none !important; }
  header { flex-wrap:wrap; gap:10px; }
  .tabs { display:flex; gap:4px; }
  .tab { border:none; border-bottom:3px solid transparent; border-radius:0; background:none; padding:6px 10px; color:var(--muted); }
  .tab[aria-selected=true] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  #impact h2 { font-size:15px; margin:18px 0 8px; }
  #pq { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  .plist { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .plist button { text-align:left; width:100%; padding:8px 12px; }
  .plist button:hover, .plist button:focus-visible { border-color:var(--accent); }
  .plist .sub { display:block; font-size:12px; color:var(--muted); }
  .plist .empty { font-size:13px; color:var(--muted); }
  .card-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .steps { margin:8px 0 0; padding-left:1.4em; font-size:13px; color:var(--muted); }
  @media (max-width: 600px) { header { padding:12px 16px; } .tabs { order:3; width:100%; } }
</style>
</head>
<body>
<header>
  <div><h1>TSI / SRSP projects — assistant</h1><small>Answers based on the European Commission's public pages (DG REFORM)</small></div>
  <nav class="tabs" role="tablist">
    <button class="tab" id="tab-chat" type="button" role="tab" aria-selected="true" aria-controls="thread">Chat</button>
    <button class="tab" id="tab-impact" type="button" role="tab" aria-selected="false" aria-controls="impact">Impact analysis</button>
  </nav>
  <button id="reset" type="button">New conversation</button>
</header>
<main>
  <div id="thread" role="tabpanel" aria-labelledby="tab-chat"></div>
  <section id="impact" role="tabpanel" aria-labelledby="tab-impact" hidden>
    <div id="punavailable" class="msg error" hidden><p>Impact analysis is not available on this server.</p></div>
    <input id="pq" type="search" autocomplete="off" placeholder="Search a project by title, country or year…" aria-label="Search a project">
    <div id="presults" class="plist"></div>
    <div id="pselected" class="msg" hidden></div>
    <div id="prun" class="msg" hidden></div>
    <div id="preport" hidden></div>
    <h2>Previous analyses</h2>
    <div id="ppast" class="plist"></div>
  </section>
</main>
<form id="form">
  <div class="row">
    <textarea id="q" placeholder="E.g. Which projects help Croatia reform its health system?" required></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </div>
  <div class="hint">Enter to send, Shift+Enter for a new line. An answer takes 20 to 60 s locally.</div>
</form>
<script>
const thread = document.getElementById("thread");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");
let history = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function isHttpUrl(u) {
  return typeof u === "string" && /^https?:\/\//.test(u);
}

// Applies inline markdown to an already-escaped fragment (bold/italic/code/[n]/autolinks).
// Never call on raw, unescaped model text. Code spans and [n] citations are swapped for placeholders first and
// restored last, so no replacement ever runs inside a generated tag (e.g. a [n] inside an autolinked href).
function inline(s, urls) {
  const codes = [];
  const cites = [];
  s = s.replace(/[\u0000\u0001]/g, "");
  s = s.replace(/`([^`\n]+?)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[(\d+)\]/g, (m, n) => {
    if (!urls[n]) return m;
    cites.push(`<sup><a href="${urls[n]}" target="_blank" rel="noopener">[${n}]</a></sup>`);
    return "\u0001" + (cites.length - 1) + "\u0001";
  });
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+?)\*/g, "<em>$1</em>");
  s = s.replace(/\b_([^_\s][^_\n]*?)_\b/g, "<em>$1</em>");
  // URL: stops at whitespace, tags, brackets, quotes (raw or escaped) and placeholders.
  s = s.replace(/(https?:\/\/(?:(?!&quot;|&#39;)[^\s<>"'\[\])\u0000\u0001])+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => cites[Number(i)]);
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + codes[Number(i)] + "</code>");
  return s;
}

// Cells are split on unescaped pipes only; "\|" inside a cell is a literal pipe.
function splitTableRow(line) {
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|") && !t.endsWith("\\|")) t = t.slice(0, -1);
  return t.split(/(?<!\\)\|/).map(c => c.replace(/\\\|/g, "|").trim());
}

function isTableSeparator(line) {
  return /^[\s|:-]+$/.test(line) && line.includes("-");
}

const HR_RE = /^(-{3,}|\*{3,}|_{3,})\s*$/;
const HEADING_RE = /^(#{1,4})\s+(.*)$/;
const QUOTE_RE = /^&gt;\s?/;
const OLI_RE = /^\s*(\d+)\.\s+(.*)$/;
const ULI_RE = /^\s*[-*] (.*)$/;

function isSpecialLine(line, next) {
  return HR_RE.test(line.trim()) || HEADING_RE.test(line) || QUOTE_RE.test(line) ||
    OLI_RE.test(line) || ULI_RE.test(line) || (line.includes("|") && next !== undefined && isTableSeparator(next));
}

// Renders already-escaped model text (see esc()) as a small, dependency-free markdown subset.
function render(text, sources) {
  const urls = {};
  (sources || []).forEach(s => { urls[s.ref] = isHttpUrl(s.url) ? esc(s.url) : "#"; });
  const lines = esc(text).split("\n");
  const out = [];
  let i = 0;
  let m;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (HR_RE.test(line.trim())) { out.push("<hr>"); i++; continue; }
    if ((m = HEADING_RE.exec(line))) {
      const tag = m[1].length <= 2 ? "h3" : "h4";
      out.push(`<${tag}>${inline(m[2], urls)}</${tag}>`);
      i++; continue;
    }
    if (line.includes("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
      const header = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
        rows.push(splitTableRow(lines[i])); i++;
      }
      let t = '<div class="table-wrap"><table><thead><tr>' +
        header.map(c => `<th>${inline(c, urls)}</th>`).join("") + "</tr></thead><tbody>";
      rows.forEach(r => { t += "<tr>" + r.map(c => `<td>${inline(c, urls)}</td>`).join("") + "</tr>"; });
      out.push(t + "</tbody></table></div>");
      continue;
    }
    if (QUOTE_RE.test(line)) {
      const quote = [];
      while (i < lines.length && QUOTE_RE.test(lines[i])) {
        quote.push(inline(lines[i].replace(QUOTE_RE, ""), urls)); i++;
      }
      out.push("<blockquote>" + quote.join("<br>") + "</blockquote>");
      continue;
    }
    if ((m = OLI_RE.exec(line))) {
      const start = m[1];
      const items = [];
      while (i < lines.length && (m = OLI_RE.exec(lines[i]))) {
        items.push(`<li>${inline(m[2], urls)}</li>`); i++;
      }
      out.push(`<ol${start !== "1" ? ` start="${start}"` : ""}>` + items.join("") + "</ol>");
      continue;
    }
    if (ULI_RE.test(line)) {
      const items = [];
      while (i < lines.length && (m = ULI_RE.exec(lines[i]))) {
        items.push(`<li>${inline(m[1], urls)}</li>`); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isSpecialLine(lines[i], lines[i + 1])) {
      para.push(inline(lines[i], urls)); i++;
    }
    out.push("<p>" + para.join("<br>") + "</p>");
  }
  return out.join("");
}

function addMessage(role, html, extra) {
  const div = document.createElement("div");
  div.className = "msg " + role + (extra && extra.error ? " error" : "");
  div.innerHTML = `<div class="who">${role === "user" ? "You" : "Assistant"}</div><div class="body">${html}</div>`;
  if (extra && extra.after) div.insertAdjacentHTML("beforeend", extra.after);
  thread.appendChild(div);
  div.scrollIntoView({behavior: "smooth", block: "end"});
  return div;
}

function details(res) {
  let html = "";
  if (res.sources && res.sources.length) {
    html += '<div class="sources"><strong>Sources</strong><ol>' + res.sources.map(s =>
      `<li value="${s.ref}"><a href="${isHttpUrl(s.url) ? esc(s.url) : "#"}" target="_blank" rel="noopener">${esc(s.title || s.doc_id)}</a>` +
      (s.section ? ` — ${esc(s.section)}` : "") + (s.ai_generated ? ' <span class="ai">(AI summary)</span>' : "") + "</li>").join("") +
      "</ol></div>";
  }
  if (res.steps && res.steps.length) {
    html += `<details><summary>${res.steps.length} agent step(s)</summary><ol>` + res.steps.map(s =>
      `<li><code>${esc(s.tool)}</code> ${esc(JSON.stringify(s.arguments))}<br><small>${esc(s.summary)}</small></li>`).join("") +
      "</ol></details>";
  }
  html += `<div class="meta">${res.duration_s} s · API-equivalent cost $${Number(res.cost_usd).toFixed(4)} · run ${esc(res.run_id)}</div>`;
  return html;
}

async function submit(question) {
  addMessage("user", render(question));
  const pending = addMessage("assistant",
    '<div class="loading"><span class="dots"><i></i><i></i><i></i></span> <em>Searching projects and deliverables…</em> <span class="elapsed">0 s</span></div>');
  const started = Date.now();
  const timer = setInterval(() => {
    pending.querySelector(".elapsed").textContent = Math.round((Date.now() - started) / 1000) + " s";
  }, 1000);
  send.disabled = true;
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({question, history})});
    const res = await r.json();
    pending.remove();
    if (!r.ok) { addMessage("assistant", `<p>${esc(res.error || "Error")}</p>`, {error: true}); return; }
    addMessage("assistant", render(res.answer, res.sources), {after: details(res)});
    history.push({role: "user", text: question}, {role: "assistant", text: res.answer});
  } catch (e) {
    pending.remove();
    addMessage("assistant", `<p>${esc(e)}</p>`, {error: true});
  } finally {
    clearInterval(timer);
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = "";
  submit(q);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
document.getElementById("reset").addEventListener("click", () => { history = []; thread.innerHTML = ""; input.focus(); });
input.focus();

// ---- Impact analysis tab ----
const tabChat = document.getElementById("tab-chat");
const tabImpact = document.getElementById("tab-impact");
const resetBtn = document.getElementById("reset");
const impact = document.getElementById("impact");
const pq = document.getElementById("pq");
const presults = document.getElementById("presults");
const pselected = document.getElementById("pselected");
const prun = document.getElementById("prun");
const preport = document.getElementById("preport");
const ppast = document.getElementById("ppast");
const punavailable = document.getElementById("punavailable");
let selected = null;        // projet choisi
let jobRunning = false;     // une analyse tourne sur le serveur
let impactAvailable = true;
let pollTimer = null;
let elapsedTimer = null;
let runStarted = 0;
let searchTimer = null;
let searchSeq = 0;

function showTab(name) {
  const isImpact = name === "impact";
  tabChat.setAttribute("aria-selected", String(!isImpact));
  tabImpact.setAttribute("aria-selected", String(isImpact));
  thread.hidden = isImpact;
  form.hidden = isImpact;
  resetBtn.hidden = isImpact;
  impact.hidden = !isImpact;
  if (isImpact) {
    if (!presults.childElementCount) searchProjects("");
    loadPast();
    checkJob();
    pq.focus();
  } else {
    input.focus();
  }
}
tabChat.addEventListener("click", () => showTab("chat"));
tabImpact.addEventListener("click", () => showTab("impact"));

function projectLine(p) {
  const prog = [p.programme, p.year].filter(Boolean).join(" ");
  const countries = (p.countries || []).join(", ");
  return [prog, countries].filter(Boolean).join(" — ");
}

// Sources numerotees de la section "## 6. Sources" -> [{ref, url}] pour les liens [n]
function reportSources(body) {
  const idx = body.indexOf("## 6. Sources");
  const part = idx >= 0 ? body.slice(idx) : "";
  const out = [];
  const re = /^- \[(\d+)\] .*?(https?:\/\/\S+)\s*$/gm;
  let m;
  while ((m = re.exec(part))) out.push({ref: Number(m[1]), url: m[2]});
  return out;
}

function showReport(front, body) {
  front = front || {};
  const meta = [front.generated ? "Generated " + front.generated : "", front.confidence ? "confidence: " + front.confidence : "",
                front.duration_s != null ? front.duration_s + " s" : "",
                front.cost_usd != null ? "API-equivalent cost $" + Number(front.cost_usd).toFixed(4) : "",
                front.run_id ? "run " + front.run_id : ""].filter(Boolean).join(" · ");
  preport.innerHTML = `<div class="msg"><div class="body">${render(body || "", reportSources(body || ""))}</div>` +
    (meta ? `<div class="meta">${esc(meta)}</div>` : "") + "</div>";
  preport.hidden = false;
}

function showError(message) {
  preport.innerHTML = `<div class="msg error"><p>${esc(message)}</p></div>`;
  preport.hidden = false;
}

function updateRunButton() {
  const btn = document.getElementById("prun-btn");
  if (btn) btn.disabled = jobRunning || !impactAvailable;
}

async function searchProjects(q) {
  const seq = ++searchSeq;
  try {
    const r = await fetch("/api/projects?q=" + encodeURIComponent(q));
    const res = await r.json();
    if (seq !== searchSeq) return;  // reponse obsolete
    const list = res.projects || [];
    presults.innerHTML = list.length ? "" : '<div class="empty">No project found.</div>';
    list.forEach(p => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `${esc(p.title || p.project_id)}<span class="sub">${esc(projectLine(p))}</span>`;
      b.addEventListener("click", () => selectProject(p));
      presults.appendChild(b);
    });
  } catch (e) {
    if (seq === searchSeq) presults.innerHTML = `<div class="empty">${esc(e)}</div>`;
  }
}
pq.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchProjects(pq.value.trim()), 250);
});

async function selectProject(p) {
  selected = p;
  pselected.innerHTML = `<div class="who">Selected project</div><div class="body"><strong>${esc(p.title || p.project_id)}</strong>` +
    `<div class="meta">${esc([projectLine(p), p.policy_area].filter(Boolean).join(" — "))}</div></div>` +
    '<div class="card-actions"><button class="primary" id="prun-btn" type="button">Run impact analysis</button>' +
    '<span class="meta">An analysis takes several minutes (web searches and page reading).</span></div>';
  pselected.hidden = false;
  document.getElementById("prun-btn").addEventListener("click", runImpact);
  updateRunButton();
  preport.hidden = true;
  preport.innerHTML = "";
  // rapport existant pour ce projet : affiche directement
  try {
    const r = await fetch("/api/impact/reports/" + encodeURIComponent(p.project_id));
    if (r.ok && selected === p) { const res = await r.json(); showReport(res.front, res.body); }
  } catch (e) { /* pas de rapport */ }
  pselected.scrollIntoView({behavior: "smooth", block: "start"});
}

function showProgress(st) {
  if (!prun.querySelector(".loading")) {
    prun.innerHTML = `<div class="who">Impact analysis — ${esc(st.project_id || "")}</div>` +
      '<div class="loading"><span class="dots"><i></i><i></i><i></i></span> <em>Analysing impact…</em> <span class="elapsed">0 s</span></div>' +
      '<ol class="steps"></ol>';
  }
  prun.hidden = false;
  prun.querySelector(".steps").innerHTML = (st.steps || []).map(s => `<li>${esc(s)}</li>`).join("");
  prun.querySelector(".elapsed").textContent = Math.round((Date.now() - runStarted) / 1000) + " s";
}

function startTracking(st) {
  jobRunning = true;
  updateRunButton();
  if (!elapsedTimer) {
    runStarted = Date.now();
    elapsedTimer = setInterval(() => {
      const el = prun.querySelector(".elapsed");
      if (el) el.textContent = Math.round((Date.now() - runStarted) / 1000) + " s";
    }, 1000);
  }
  showProgress(st);
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, 2000);
}

function stopTracking() {
  jobRunning = false;
  clearTimeout(pollTimer); pollTimer = null;
  clearInterval(elapsedTimer); elapsedTimer = null;
  prun.hidden = true;
  prun.innerHTML = "";
  updateRunButton();
}

function handleStatus(st) {
  if (st.state === "running") { startTracking(st); return; }
  const wasTracking = jobRunning;
  stopTracking();
  if (!wasTracking) return;  // fin d'une analyse non suivie par cette page : rien a afficher
  if (st.state === "done" && st.result) {
    showReport(st.result.front, st.result.body);
    loadPast();
  } else if (st.state === "error") {
    showError(st.error || "The analysis failed.");
  }
}

async function poll() {
  try {
    const r = await fetch("/api/impact/job");
    if (!r.ok) throw new Error("HTTP " + r.status);
    handleStatus(await r.json());
  } catch (e) {
    // erreur reseau passagere : on reessaie
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, 2000);
  }
}

async function checkJob() {
  try {
    const r = await fetch("/api/impact/job");
    if (r.status === 503) {
      impactAvailable = false;
      punavailable.hidden = false;
      updateRunButton();
      return;
    }
    const st = await r.json();
    if (st.state === "running" && !jobRunning) startTracking(st);
  } catch (e) { /* serveur injoignable */ }
}

async function runImpact() {
  if (!selected || jobRunning) return;
  preport.hidden = true;
  preport.innerHTML = "";
  jobRunning = true;
  updateRunButton();
  try {
    const r = await fetch("/api/impact", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({project_id: selected.project_id})});
    const res = await r.json();
    jobRunning = false;
    if (r.status === 409) { showError(res.error || "An analysis is already running."); checkJob(); return; }
    if (!r.ok) { updateRunButton(); showError(res.error || "Error"); return; }
    startTracking(res);
  } catch (e) {
    jobRunning = false;
    updateRunButton();
    showError(String(e));
  }
}

async function loadPast() {
  try {
    const r = await fetch("/api/impact/reports");
    const list = (await r.json()).reports || [];
    ppast.innerHTML = list.length ? "" : '<div class="empty">No analysis yet.</div>';
    list.forEach(f => {
      const b = document.createElement("button");
      b.type = "button";
      const verdict = String(f.overall_verdict || "").replace(/\s*\[\d+\]/g, "");
      const sub = [f.generated ? "Generated " + f.generated : "", f.confidence ? "confidence: " + f.confidence : ""].filter(Boolean).join(" · ");
      b.innerHTML = `${esc(f.title || f.project_id)}<span class="sub">${esc(sub)}</span>` +
        (verdict ? `<span class="sub">${esc(verdict.length > 220 ? verdict.slice(0, 220) + "…" : verdict)}</span>` : "");
      b.addEventListener("click", () => openReport(f.project_id));
      ppast.appendChild(b);
    });
  } catch (e) {
    ppast.innerHTML = `<div class="empty">${esc(e)}</div>`;
  }
}

async function openReport(projectId) {
  try {
    const r = await fetch("/api/impact/reports/" + encodeURIComponent(projectId));
    const res = await r.json();
    if (!r.ok) { showError(res.error || "Error"); return; }
    showReport(res.front, res.body);
  } catch (e) {
    showError(String(e));
  }
  preport.scrollIntoView({behavior: "smooth", block: "start"});
}

// au chargement : reprend l'affichage d'une analyse en cours
checkJob();
</script>
