# Pipeline "tsi-impact" (trial, essai de la configuration de production) : index tsi-projects du trial, mais modele
# OpenAI gpt-5.4 et recherche web OpenAI integree (sous-pipeline web_search), comme deploy/prod/pipeline-tsi-impact.yaml.
# A coller a la place de pipeline-tsi-impact.yaml dans le pipeline tsi-impact du trial.
components:
  agent:
    type: haystack.components.agents.agent.Agent
    init_parameters:
      chat_generator:
        type: haystack.components.generators.chat.openai.OpenAIChatGenerator
        init_parameters:
          api_key:
            type: env_var
            env_vars:
            - OPENAI_API_KEY
            strict: false
          model: gpt-5.4
          generation_kwargs:
            max_completion_tokens: 8000
      exit_conditions:
      - text
      max_agent_steps: 10
      raise_on_tool_invocation_failure: false
      state_schema:
        documents:
          type: list[haystack.Document]
      streaming_callback: deepset_cloud_custom_nodes.callbacks.streaming.streaming_callback
      system_prompt: |-
        You are an impact analyst for the European Commission's DG REFORM. You assess the impact of one
        Technical Support Instrument (TSI) or SRSP project on its country, on Europe and on the world, against
        the project's own objectives. The user gives a project title or id.

        Method:
        1. Call search_projects with the project title (and country) to read the project: identify its
           objectives and the actions carried out. Passages end with the project id and its source URL.
        2. Search the web with web_search (it returns findings with their source URLs) for evidence of impact: adoption and implementation of the reform
           (laws, decrees, action plans), indicators before and after, evaluations, OECD / World Bank / European
           Commission documents (European Semester country reports, recovery and resilience plans), government
           sites, press articles, criticism. Use precise English queries naming the country, the institution and
           the reform. At most 4 web searches: you have a strict time limit.

        Rules:
        - Cite project passages with their number [n]; cite web sources with a Markdown link to the source URL given
          by web_search, e.g. ([OECD 2024](https://...)). Never invent a source, a URL, a figure or an impact.
        - Distinguish correlation from causation: say how directly the evidence can be attributed to the
          project (causal link established, plausible, or unclear).
        - When evidence is missing or too recent, say so: a short, honest report is better than a speculative one.
        - Write in English, concise and factual.

        Answer with a Markdown report with these sections:
        **Project overview** (objectives and actions), **Evidence of positive impact**, **Evidence of negative
        impact or limitations**, **Impact by level** (country, Europe, world), **Objectives** (a table:
        objective | verdict: achieved, partly achieved, not achieved or insufficient evidence | rationale),
        **Overall verdict** (one or two sentences).
        End with exactly one line: "Impact score: X/10 (strong | moderate | weak) — Confidence: high | medium |
        low", where 7-10 is strong, 4-6 moderate and 0-3 weak positive impact supported by the evidence found.
      tools:
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: search_projects
          description: >-
            Semantic and keyword search in the texts of TSI and SRSP projects. Returns numbered passages. Write a
            precise English query with the project title or its topic and country.
          input_mapping:
            query:
            - retriever.query
            documents:
            - builder.existing_documents
          output_mapping:
            builder.prompt: formatted_docs
            retriever.documents: documents
          inputs_from_state:
            documents: documents
          outputs_to_state:
            documents:
              source: documents
          outputs_to_string:
            source: formatted_docs
          parameters:
          is_pipeline_async: false
          pipeline:
            components:
              retriever:
                type: haystack_integrations.components.retrievers.opensearch.open_search_hybrid_retriever.OpenSearchHybridRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      hosts:
                      - ${OPENSEARCH_HOST}
                      http_auth:
                      - ${OPENSEARCH_USER}
                      - ${OPENSEARCH_PASSWORD}
                      use_ssl: true
                      verify_certs: false
                      index: tsi-projects
                      embedding_dim: 768
                      similarity: cosine
                  top_k: 8
                  fuzziness: 0
                  embedder:
                    type: deepset_cloud_custom_nodes.embedders.nvidia.text_embedder.DeepsetNvidiaTextEmbedder
                    init_parameters:
                      model: intfloat/multilingual-e5-base
                      prefix: 'query: '
                      normalize_embeddings: true
              builder:
                type: haystack.components.builders.prompt_builder.PromptBuilder
                init_parameters:
                  required_variables:
                  - existing_documents
                  - docs
                  template: |-
                    {%- if existing_documents is not none -%}
                    {%- set existing_doc_len = existing_documents|length -%}
                    {%- else -%}
                    {%- set existing_doc_len = 0 -%}
                    {%- endif -%}
                    {%- for doc in docs %}
                    <document reference="{{loop.index + existing_doc_len}}">
                    {{ doc.content }}
                    </document>
                    {% endfor -%}
            connections:
            - sender: retriever.documents
              receiver: builder.docs
            max_runs_per_component: 100
            metadata: {}
      - type: haystack.tools.component_tool.ComponentTool
        data:
          name: web_search
          description: >-
            Search the web (OpenAI web search) and return the main findings, each with its source URL. Use one
            precise English query per call, naming the country, the institution and the reform.
          inputs_from_state:
          parameters:
            type: object
            properties:
              query:
                type: string
                description: Precise English web search query.
            required:
            - query
          component:
            type: haystack.core.super_component.super_component.SuperComponent
            init_parameters:
              input_mapping:
                query:
                - prompt.query
              output_mapping:
                adapter.output: result
              is_pipeline_async: false
              pipeline:
                components:
                  prompt:
                    type: haystack.components.builders.chat_prompt_builder.ChatPromptBuilder
                    init_parameters:
                      required_variables:
                      - query
                      template: |-
                        {% message role="user" %}
                        Search the web for: {{ query }}

                        Report the most relevant findings for an impact assessment (laws, decisions, indicators,
                        evaluations, criticism), most authoritative sources first: official, OECD, World Bank,
                        European Commission, then press. One line per finding: the finding with its date, then the
                        source URL in parentheses. Only report what the sources say; at most 400 words, in English.
                        If nothing relevant is found, say so.
                        {% endmessage %}
                  searcher:
                    type: haystack.components.generators.chat.openai_responses.OpenAIResponsesChatGenerator
                    init_parameters:
                      api_key:
                        type: env_var
                        env_vars:
                        - OPENAI_API_KEY
                        strict: false
                      model: gpt-5.4
                      tools:
                      - type: web_search
                      generation_kwargs:
                        reasoning:
                          effort: low
                  adapter:
                    type: haystack.components.converters.output_adapter.OutputAdapter
                    init_parameters:
                      template: '{{ replies[-1].text }}'
                      output_type: str
                      custom_filters: {}
                      unsafe: false
                connections:
                - sender: prompt.prompt
                  receiver: searcher.messages
                - sender: searcher.replies
                  receiver: adapter.replies
                max_runs_per_component: 100
                metadata: {}

  adapter:
    type: haystack.components.converters.output_adapter.OutputAdapter
    init_parameters:
      template: '{{ [(messages|last).text] }}'
      output_type: list[str]
      custom_filters: {}
      unsafe: false

  answer_builder:
    type: haystack.components.builders.answer_builder.AnswerBuilder
    init_parameters:
      reference_pattern: \[(\d+)\]
      last_message_only: false
      return_only_referenced_documents: true

connections:
- sender: agent.messages
  receiver: adapter.messages
- sender: adapter.output
  receiver: answer_builder.replies
- sender: agent.documents
  receiver: answer_builder.documents

inputs:
  messages:
  - agent.messages
  query:
  - answer_builder.query

outputs:
  answers: answer_builder.answers
  documents: agent.documents

pipeline_output_type: chat

max_runs_per_component: 100

metadata: {}
