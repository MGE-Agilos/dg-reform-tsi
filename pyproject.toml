[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsi-agent"
version = "0.1.0"
description = "Agent d'extraction des projets TSI/SRSP (DG REFORM) - pipeline Haystack"
requires-python = ">=3.11"
dependencies = [
    "haystack-ai>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "trafilatura>=1.12",
    "openpyxl>=3.1",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Embedder local (PyTorch CPU + modele). Pas installe dans deepset, qui passe par l'API OpenAI.
local = ["sentence-transformers-haystack>=0.1.2", "flask>=3", "qdrant-haystack>=11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsi_agent = ["chat/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: vrai modele d'embedding, lance a la main (pytest -m integration)"]
addopts = "-m 'not integration'"
